<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Étude en psychologie cognitive</title>

  <!-- jsPsych 7.3.4 CSS & Core -->
  <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css">
  <script src="https://unpkg.com/jspsych@7.3.4/dist/index.browser.min.js"></script>

  <!-- Plugins jsPsych -->
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3/dist/index.browser.min.js"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3/dist/index.browser.min.js"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-slider-response@1.1.3/dist/index.browser.min.js"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3/dist/index.browser.min.js"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@1.1.3/dist/index.browser.min.js"></script>
  <script src="https://unpkg.com/@jspsych/plugin-fullscreen@1.2.1/dist/index.browser.min.js"></script>

  <!-- Firebase Compat -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    body {
      background-color: #ffffff !important;
      color: #0f172a !important;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
    }
    .jspsych-display-element {
      background-color: #ffffff !important;
      color: #0f172a !important;
    }
    .jspsych-content {
      max-width: 850px;
      margin: auto;
      color: #0f172a !important;
    }
    .jspsych-content p, .jspsych-content h1, .jspsych-content h2, .jspsych-content span, .jspsych-content label {
      color: #0f172a !important;
    }

    /* Alignement vertical et centré des options radio (sexe, âge) */
    .jspsych-survey-multi-choice-question {
      text-align: left;
      display: inline-block;
      margin-bottom: 2em;
    }
    .jspsych-survey-multi-choice-option {
      display: block !important;
      margin: 10px 0 !important;
      text-align: left;
    }
    .jspsych-survey-multi-choice-text, .jspsych-survey-multi-choice-option label {
      color: #0f172a !important;
      cursor: pointer;
      font-size: 1rem;
      margin-left: 8px;
    }

    /* Champs de saisie numérique */
    input[type="text"], input[type="number"] {
      background-color: #f8fafc !important;
      color: #0f172a !important;
      border: 2px solid #94a3b8 !important;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 1rem;
      text-align: center;
    }

    /* Sliders de certitude */
    .jspsych-slider {
      background-color: #cbd5e1 !important;
    }
    .jspsych-html-slider-response-container p {
      color: #0f172a !important;
    }

    /* Boutons standards */
    .jspsych-btn {
      color: #ffffff !important;
      background-color: #2563eb;
      border: 1px solid #1d4ed8;
      border-radius: 6px;
      padding: 10px 22px;
      font-weight: 600;
      cursor: pointer;
    }
    .jspsych-btn:hover { background-color: #1d4ed8; }
    .jspsych-btn:disabled {
      background-color: #94a3b8 !important;
      border-color: #94a3b8 !important;
      color: #e2e8f0 !important;
      cursor: not-allowed;
    }

    /* Grilles de sélection pour l'objet inattendu */
    #shape-options, #color-options, #size-options {
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <script src="experiment.js"></script>
</body>
</html>
