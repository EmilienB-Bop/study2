<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Étude en psychologie cognitive</title>

  <!-- Feuilles de style et coeur jsPsych 7 -->
  <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css">
  <script src="https://unpkg.com/jspsych@7.3.4"></script>

  <!-- Plugins jsPsych nécessaires au protocole -->
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-slider-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-fullscreen@1.2.1"></script>

  <!-- SDKs Firebase (version compat pour exécution directe sans bundler) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    /* 1. Fond et typographie générale */
    body {
      background-color: #ffffff !important;
      color: #0f172a !important;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
    }

    .jspsych-display-element {
      background-color: #ffffff !important;
      color: #0f172a !important;
    }

    .jspsych-content {
      max-width: 850px;
      color: #0f172a !important;
      /* On s'assure que le conteneur principal reste bien centré */
      margin: auto;
    }

    /* 2. Textes et labels bien lisibles en sombre */
    .jspsych-content p,
    .jspsych-content h1,
    .jspsych-content h2,
    .jspsych-content h3,
    .jspsych-content span,
    .jspsych-content label {
      color: #0f172a !important;
    }

    /* 3. Restauration de l'alignement natif jsPsych pour les questions */
    .jspsych-survey-multi-choice-question,
    .jspsych-survey-text-question {
      margin-bottom: 2em;
    }

    .jspsych-survey-multi-choice-option {
      /* Conserve l'alignement propre des puces radio */
      display: inline-block;
      margin: 0 10px;
    }

    .jspsych-survey-multi-choice-text,
    .jspsych-survey-multi-choice-option label {
      color: #0f172a !important;
      cursor: pointer;
    }

    /* 4. Champs de saisie texte (centrés et lisibles) */
    input[type="text"],
    input[type="number"] {
      background-color: #f8fafc !important;
      color: #0f172a !important;
      border: 2px solid #94a3b8 !important;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 1rem;
      text-align: center;
    }

    input[type="text"]:focus,
    input[type="number"]:focus {
      outline: none;
      border-color: #2563eb !important;
      background-color: #ffffff !important;
    }

    /* 5. Réglettes de confiance */
    .jspsych-slider {
      background-color: #cbd5e1 !important;
    }

    .jspsych-html-slider-response-container p,
    .jspsych-html-slider-response-response span {
      color: #334155 !important;
      font-weight: 500;
    }

    /* 6. Formulaire de consentement */
    div[style*="background:rgba(255,255,255,0.06)"],
    div[style*="max-height:70vh"] {
      background-color: #f8fafc !important;
      border: 1px solid #cbd5e1 !important;
      color: #1e293b !important;
    }

    div[style*="background:rgba(255,255,255,0.06)"] * {
      color: #1e293b !important;
    }

    /* 7. Boutons */
    .jspsych-btn {
      color: #ffffff !important;
      background-color: #2563eb;
      border: 1px solid #1d4ed8;
      border-radius: 6px;
      padding: 10px 20px;
      font-weight: 600;
      cursor: pointer;
    }

    .jspsych-btn:hover {
      background-color: #1d4ed8;
    }

    .jspsych-btn:disabled {
      background-color: #94a3b8 !important;
      border-color: #94a3b8 !important;
      color: #e2e8f0 !important;
      cursor: not-allowed;
    }

    /* 8. Options de formes et couleurs */
    #shape-options, #color-options, #size-options {
      display: flex;
      justify-content: center;
      gap: 24px;
    }

    #shape-options div span,
    #color-options div span,
    #size-options div span {
      color: #0f172a !important;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <!-- Chargement du script expérimental -->
  <script src="experiment.js"></script>
</body>
</html>
